[project]
name = "truss-fem-solver"
version = "1.0.0"
description = "2D truss finite element solver (direct stiffness method), validated against analytical solutions"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# matplotlib on Python 3.9 triggers deprecation notices inside the pyparsing library; they are not from this code
filterwarnings = ["ignore:.*deprecated - use:DeprecationWarning"]
